name: Build Crown and Cinder Fabric JAR

on:
  push:
    branches: [ crown-cinder-build-20260910 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct and verify original source ZIP
        run: |
          cat crown-source-chunks/part00-fixed.txt \
              crown-source-chunks/part01.txt \
              crown-source-chunks/part02.txt \
              crown-source-chunks/part03.txt | base64 -d > crown-source.zip
          echo "06d2ed423a04feea12a103e968025de344f574d953cab0ac62900d209def39d9  crown-source.zip" | sha256sum -c -
          unzip -t crown-source.zip
          rm -rf crown-build
          mkdir crown-build
          unzip -q crown-source.zip -d crown-build

      - name: Build Fabric mod
        working-directory: crown-build/crown-and-cinder
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify install JAR
        working-directory: crown-build/crown-and-cinder
        run: |
          ls -lh build/libs
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q '^fabric.mod.json$'
          echo "INSTALL_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Stage install JAR
        run: |
          cp "crown-build/crown-and-cinder/${INSTALL_JAR}" crown-and-cinder-0.1.0-fabric-1.20.1.jar
          sha256sum crown-and-cinder-0.1.0-fabric-1.20.1.jar

      - name: Upload install JAR
        uses: actions/upload-artifact@v4
        with:
          name: crown-and-cinder-0.1.0-fabric-1.20.1
          path: crown-and-cinder-0.1.0-fabric-1.20.1.jar
          compression-level: 0
          if-no-files-found: error
