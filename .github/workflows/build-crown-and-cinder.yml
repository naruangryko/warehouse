name: Build Crown and Cinder 0.8.0
on:
  push:
    branches: [crown-cinder-build-20260910]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reconstruct verified base source
        run: |
          cat crown-source-chunks/part00-fixed.txt crown-source-chunks/part01.txt crown-source-chunks/part02.txt crown-source-chunks/part03.txt | base64 -d > crown-source.zip
          echo '06d2ed423a04feea12a103e968025de344f574d953cab0ac62900d209def39d9  crown-source.zip' | sha256sum -c -
          rm -rf build-work
          mkdir build-work
          unzip -q crown-source.zip -d build-work
      - name: Apply 0.3.0 base expansion
        run: |
          base64 -d crown-patch-0.3.0.zip.b64 > crown-patch-0.3.0.zip
          unzip -oq crown-patch-0.3.0.zip -d build-work/crown-and-cinder
          cp crown-patch-0.2.0/ProgressService.java build-work/crown-and-cinder/src/main/java/dev/crowncinder/progress/ProgressService.java
      - name: Apply 0.4.0 physical economy patch
        run: |
          base64 -d crown-patch-0.4.0.zip.b64 > crown-patch-0.4.0.zip
          unzip -oq crown-patch-0.4.0.zip -d build-work/crown-and-cinder
      - name: Apply 0.5.0 NPC outpost patch
        run: |
          base64 -d crown-patch-0.5.0.zip.b64 > crown-patch-0.5.0.zip
          unzip -oq crown-patch-0.5.0.zip -d build-work/crown-and-cinder
      - name: Apply 0.6.0 combat dungeon patch
        run: cp -r crown-patch-0.6.0/. build-work/crown-and-cinder/
      - name: Apply 0.7.0 kingdom patch
        run: cp -r crown-patch-0.7.0/. build-work/crown-and-cinder/
      - name: Apply 0.8.0 combat NPC patch
        run: |
          cp -r crown-patch-0.8.0/. build-work/crown-and-cinder/
          grep -q 'mod_version=0.8.0' build-work/crown-and-cinder/gradle.properties
      - name: Run core tests and build Fabric mod
        working-directory: build-work/crown-and-cinder
        run: gradle --no-daemon clean test coreTest remapJar --stacktrace
      - name: Verify install JAR
        working-directory: build-work/crown-and-cinder
        run: |
          test -f build/libs/crown-and-cinder-0.8.0.jar
          jar tf build/libs/crown-and-cinder-0.8.0.jar | grep -q 'dev/crowncinder/entity/CrownGuardEntity.class'
          jar tf build/libs/crown-and-cinder-0.8.0.jar | grep -q 'dev/crowncinder/world/RpgOutpost.class'
          jar tf build/libs/crown-and-cinder-0.8.0.jar | grep -q 'dev/crowncinder/item/KingdomMapItem.class'
          jar tf build/libs/crown-and-cinder-0.8.0.jar | grep -q 'dev/crowncinder/entity/MinotaurEntity.class'
          unzip -p build/libs/crown-and-cinder-0.8.0.jar fabric.mod.json | grep -q '0.8.0'
      - name: Stage install JAR
        run: |
          mkdir -p artifact
          cp build-work/crown-and-cinder/build/libs/crown-and-cinder-0.8.0.jar artifact/crown-and-cinder-0.8.0-fabric-1.20.1.jar
      - name: Upload install JAR
        uses: actions/upload-artifact@v4
        with:
          name: crown-and-cinder-0.8.0-fabric-1.20.1
          path: artifact/crown-and-cinder-0.8.0-fabric-1.20.1.jar
